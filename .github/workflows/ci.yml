name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # postinstall runs `prisma generate`
      - name: Migrations match schema, seed applies
        env:
          DATABASE_URL: file:./ci.db
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          npx prisma db seed
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm run test:coverage
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end (Playwright) and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Playwright
        # playwright.config.ts prepares a fresh database and starts `next start` on its own.
        run: npm run e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 14
          # The report folders are dot-directories, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: ignore
